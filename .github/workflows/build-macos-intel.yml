name: 构建衡势 Intel 与 Apple Silicon Mac 安装包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            pyarch: x86_64
            artifact: 衡势-1.3.1-macOS-Intel.dmg
          - runner: macos-15
            arch: arm64
            pyarch: arm64
            artifact: 衡势-1.3.1-macOS-Apple-Silicon.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch == 'x64' && 'x64' || 'arm64' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch == 'x64' && 'x64' || 'arm64' }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: 安装后端依赖
        run: python -m pip install -r requirements-backend.txt
      - name: 验证分析与数据契约
        run: >-
          python -m unittest
          tests.test_data_service tests.test_market_model tests.test_market_view
          tests.test_signals tests.test_translation_service tests.test_valuation_history
          tests.test_valuation tests.test_event_intelligence tests.test_desktop_state
          tests.test_research_revision tests.test_tracking tests.test_unified_research tests.test_intraday
          tests.test_backend_startup
      - name: 构建 ${{ matrix.arch }} Python 后端
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --target-arch ${{ matrix.pyarch }} --name hengshi-backend
          --add-data assets/sp500_constituents.csv:assets electron_backend.py
      - name: 准备 Electron 资源
        run: |
          mkdir -p electron/resources/backend electron/build
          mkdir -p electron/resources/backend/hengshi-backend
          cp -R dist/hengshi-backend/. electron/resources/backend/hengshi-backend/
          chmod +x electron/resources/backend/hengshi-backend/hengshi-backend
          python -c "from build_macos_intel import make_icon; make_icon()"
          cp nexus.icns electron/build/icon.icns
      - name: 冒烟测试打包后的本地服务
        run: python tools/smoke_packaged_backend.py electron/resources/backend/hengshi-backend/hengshi-backend
      - name: 安装 Electron 依赖
        working-directory: electron
        run: pnpm install --frozen-lockfile
      - name: 检查前端与主进程
        working-directory: electron
        run: pnpm run check
      - name: 下载并校验官方 Electron 运行库
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: python download_electron_runtime.py
      - name: 构建 ${{ matrix.arch }} DMG
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish never --config.electronDist=resources/electron-runtime.zip
      - name: 规范化 DMG 文件名
        working-directory: electron
        run: mv dist/*.dmg "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 衡势-macOS-${{ matrix.arch }}-DMG
          path: electron/dist/${{ matrix.artifact }}
          if-no-files-found: error
