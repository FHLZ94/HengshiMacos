name: 构建衡势 Windows 安装包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行测试
        run: python -m unittest discover -s tests -q
      - name: 打包桌面程序
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --windowed --onefile
          --icon nexus.ico --add-data 'frontend;frontend'
          --add-data 'assets/sp500_constituents.csv;assets'
          --version-file version_info.txt --name 衡势
          --distpath dist/release desktop.py
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 构建中文安装向导
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: 衡势-Windows-安装包
          path: installer/衡势-安装包.exe
          if-no-files-found: error
